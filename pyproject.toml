[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-nz"
version = "1.0.0"
description = "Production-grade, NIST-compliant Async Authentication & Authorization IAM Engine for Python/FastAPI"
readme = "README.md"
authors = [{ name = "L4S3r Security Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["authentication", "authorization", "rbac", "abac", "mfa", "totp", "jwt", "fastapi", "security", "iam"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Framework :: FastAPI",
]
dependencies = [
    "bcrypt>=4.0.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "pyotp>=2.9.0",
    "SQLAlchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "argon2-cffi>=23.1.0",
]

[project.scripts]
authnz = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
