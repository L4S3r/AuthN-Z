[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l4s3r-authnz"
version = "1.2.0"
description = "Production-grade, NIST-compliant Async Authentication & Authorization IAM Engine for Python/FastAPI"
readme = "README.md"
authors = [{ name = "L4S3r" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["authentication", "authorization", "rbac", "abac", "mfa", "totp", "jwt", "fastapi", "security", "iam"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Framework :: FastAPI",
]
dependencies = [
    "bcrypt>=4.0.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "fido2>=1.1.0",
    "pyotp>=2.9.0",
    "SQLAlchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "argon2-cffi>=23.1.0",
]

[project.scripts]
authnz = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_nz*", "api*"]
exclude = ["alembic*", "assets*", "policies*", "tests*", "examples*"]

[tool.setuptools]
py-modules = [
    "authenticator",
    "password_hasher",
    "token_service",
    "mfa_provider",
    "device_trust_service",
    "session_store",
    "permission_evaluator",
    "audit_logger",
    "user_repository",
    "workspace_repository",
    "oauth_provider",
    "email_service",
    "webauthn_service",
    "policy_engine",
    "opa_client",
    "database",
    "config",
    "exceptions",
    "guards",
    "metrics",
    "server",
    "cli",
    "models",
    "default_user",
    "workspace_models",
    "adapter",
    "task_repository",
    "seed_admin",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]